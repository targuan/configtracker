name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - feature/**
      - fix/**
  pull_request:
    branches:
      - main
      - feature/**
      - fix/**
  release:
    types: [published]

jobs:
  # Build job - runs on all pushes and PRs
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Setup Node.js for frontend
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # Install frontend dependencies
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # Build frontend
      - name: Build frontend
        working-directory: frontend
        run: npm run build

      # Setup Python for backend
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Install backend dependencies
      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Lint backend
      - name: Lint backend
        working-directory: backend
        run: |
          pip install flake8
          flake8 . --max-line-length=120

      # Test backend
      - name: Test backend
        working-directory: backend
        run: |
          python manage.py check

  # Docker build job - runs on PR updates (but doesn't push)
  docker-build-pr:
    name: Docker Build (PR)
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref != 'refs/heads/main')
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker base image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile-base
          push: false
          tags: configtracker-base:test

      - name: Build Docker frontend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile-frontend
          push: false
          tags: configtracker-frontend:test
          build-args: BASE_IMAGE=configtracker-base:test

      - name: Build Docker backend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile-backend
          push: false
          tags: configtracker-backend:test
          build-args: BASE_IMAGE=configtracker-base:test

  # Version bump job - runs on merge to main
  version-bump:
    name: Version Bump (Beta)
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Get current version
        id: get-version
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          echo "Current version: $CURRENT_VERSION"
          echo "current_version=$CURRENT_VERSION" >> $GITHUB_OUTPUT

      - name: Determine bump type from commits
        id: determine-bump
        run: |
          # Check last 10 commits for version bump keywords
          COMMITS=$(git log --pretty=format:"%s" HEAD~10..HEAD 2>/dev/null || echo "")
          
          if echo "$COMMITS" | grep -qE "BREAKING CHANGE|BREAKING-CHANGE|!:"; then
            BUMP_TYPE="major"
          elif echo "$COMMITS" | grep -qE "feat:|feature:"; then
            BUMP_TYPE="minor"
          else
            BUMP_TYPE="patch"
          fi
          
          echo "Determined bump type: $BUMP_TYPE"
          echo "bump_type=$BUMP_TYPE" >> $GITHUB_OUTPUT

      - name: Bump version (beta)
        id: bump-version
        run: |
          CURRENT_VERSION="${{ steps.get-version.outputs.current_version }}"
          BUMP_TYPE="${{ steps.determine-bump.outputs.bump_type }}"
          
          # Parse version
          MAJOR=$(echo "$CURRENT_VERSION" | cut -d. -f1)
          MINOR=$(echo "$CURRENT_VERSION" | cut -d. -f2)
          PATCH=$(echo "$CURRENT_VERSION" | cut -d. -f3 | cut -d- -f1)
          
          # Check if it's a pre-release
          if echo "$CURRENT_VERSION" | grep -qE "-[a-z]+\."; then
            # Already a prerelease, increment the prerelease number
            PRE_TYPE=$(echo "$CURRENT_VERSION" | grep -oE "-[a-z]+\." | sed 's/^-//' | cut -d. -f1)
            PRE_NUM=$(echo "$CURRENT_VERSION" | grep -oE "\.[0-9]+$" | cut -d. -f2)
            if [ -z "$PRE_NUM" ]; then
              PRE_NUM=1
            else
              PRE_NUM=$((PRE_NUM + 1))
            fi
            NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}-${PRE_TYPE}.${PRE_NUM}"
          else
            # Not a prerelease, create beta.1
            case "$BUMP_TYPE" in
              major)
                MAJOR=$((MAJOR + 1))
                MINOR=0
                PATCH=0
                ;;
              minor)
                MINOR=$((MINOR + 1))
                PATCH=0
                ;;
              patch)
                PATCH=$((PATCH + 1))
                ;;
            esac
            NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}-beta.1"
          fi
          
          echo "New beta version: $NEW_VERSION"
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Update version in package.json
        run: |
          npm version ${{ steps.bump-version.outputs.new_version }} --no-git-tag-version
          echo "Updated version to: $(node -p "require('./package.json').version")"

      - name: Commit version bump
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add package.json
          git commit -m "chore: bump version to ${{ steps.bump-version.outputs.new_version }} [skip ci]"
          git push origin main

  # Release job - runs when a release is published
  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'release' && github.event.action == 'published'
    
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Get release version
        id: get-release-version
        run: |
          # Use the release tag as the version
          RELEASE_VERSION=${{ github.ref_name }}
          # Remove 'v' prefix if present
          RELEASE_VERSION=${RELEASE_VERSION#v}
          echo "Release version: $RELEASE_VERSION"
          echo "release_version=$RELEASE_VERSION" >> $GITHUB_OUTPUT

      - name: Update version in package.json
        run: |
          npm version ${{ steps.get-release-version.outputs.release_version }} --no-git-tag-version
          echo "Updated version to: $(node -p "require('./package.json').version")"

      - name: Commit release version
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add package.json
          git commit -m "chore: release ${{ steps.get-release-version.outputs.release_version }} [skip ci]"
          git push origin main

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: Automatic release created by CI/CD
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Docker build and push for release
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker base image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile-base
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:base-${{ steps.get-release-version.outputs.release_version }}
            ghcr.io/${{ github.repository }}:base-latest

      - name: Build and push Docker frontend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile-frontend
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:frontend-${{ steps.get-release-version.outputs.release_version }}
            ghcr.io/${{ github.repository }}:frontend-latest
          build-args: BASE_IMAGE=ghcr.io/${{ github.repository }}:base-${{ steps.get-release-version.outputs.release_version }}

      - name: Build and push Docker backend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile-backend
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:backend-${{ steps.get-release-version.outputs.release_version }}
            ghcr.io/${{ github.repository }}:backend-latest
          build-args: BASE_IMAGE=ghcr.io/${{ github.repository }}:base-${{ steps.get-release-version.outputs.release_version }}
