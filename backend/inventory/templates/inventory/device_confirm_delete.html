<!DOCTYPE html>
<html>
<head>
    <title>Delete Device</title>
</head>
<body>
    <h1>Delete Device</h1>
    <p>Are you sure you want to delete {{ object.name }}?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit">Confirm Delete</button>
    </form>
    <a href="{% url 'device-list' %}">Cancel</a>
</body>
</html>
